<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>资金费监控台</title>
  <style>
    :root{--bg:#080b11;--panel:#111722;--panel2:#171f2c;--line:#253044;--text:#f4f7fb;--muted:#8f9bb0;--green:#45e39a;--lime:#b8f35b;--red:#ff6b7a;--amber:#ffca63;--blue:#69a7ff;--r:18px}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#183155 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;min-height:100vh}
    .shell{max-width:1280px;margin:auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--lime);font-weight:750;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font-size:clamp(25px,5vw,42px);line-height:1.1;margin:5px 0 7px}.sub{color:var(--muted)}.status{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#101722;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px currentColor}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
    .error{display:none;background:#36171e;border:1px solid #71303c;color:#ffc4cb;padding:12px 15px;border-radius:12px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}.card{background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:104px}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:780;margin-top:10px;letter-spacing:-.03em}.unit{font-size:12px;color:var(--muted);margin-left:4px}
    .panel{background:rgba(15,20,30,.92);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 22px 80px rgba(0,0,0,.22)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:6px;overflow:auto}.tab{border:0;color:var(--muted);background:transparent;padding:10px 13px;border-radius:11px;font-weight:650;cursor:pointer;white-space:nowrap}.tab.active{background:#263247;color:#fff}.search{width:230px;max-width:42vw;background:#0a0f17;border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px 12px;outline:none}.search:focus{border-color:var(--blue)}
    .tablewrap{overflow:auto;min-height:380px}table{width:100%;border-collapse:collapse;min-width:790px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:650;padding:13px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101620}td{padding:14px 16px;border-bottom:1px solid rgba(37,48,68,.65)}tr:hover td{background:#151d29}.sym{font-weight:760}.small{color:var(--muted);font-size:12px}.pos{color:var(--green);font-variant-numeric:tabular-nums}.neg{color:var(--red)}.warn{color:var(--amber)}.num{font-variant-numeric:tabular-nums}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#253043;color:#aeb9cb}.badge.yes{color:#7df0b6;background:#123429}.badge.no{color:#a4afc1}.badge.warn{color:#ffd88b;background:#382d16}.empty{text-align:center;padding:78px 20px;color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;padding:12px 16px;background:#0c1119}.spin{display:inline-block;width:12px;height:12px;border:2px solid #40506a;border-top-color:var(--lime);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .settings{padding:18px;max-width:1120px;margin:auto}.settingsIntro{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;background:#111a27;border:1px solid var(--line);padding:16px;border-radius:15px;margin-bottom:16px}.settingsIntro h2{margin:0 0 5px;font-size:19px}.notice{padding:11px 13px;border-radius:11px;background:#17243a;color:#b9d3ff;margin:0 0 14px}.notice.good{background:#123429;color:#8ff2bf}.notice.bad{background:#36171e;color:#ffc4cb}.settingSection{margin:16px 0 20px}.settingSection h3{font-size:15px;margin:0 0 10px}.settingGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.settingField{display:flex;flex-direction:column;gap:6px;background:#0c121c;border:1px solid var(--line);border-radius:13px;padding:12px}.settingField label{font-weight:650}.settingField input{width:100%;background:#080d14;border:1px solid #303c52;color:#fff;border-radius:9px;padding:10px 11px;font:inherit;outline:none}.settingField input:focus{border-color:var(--blue)}.settingHint{font-size:11px;color:var(--muted);min-height:32px}.settingActions{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:13px;background:rgba(12,17,25,.96);border:1px solid var(--line);border-radius:14px}.btn{border:1px solid var(--line);background:#202b3d;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.btn.primary{background:var(--lime);border-color:var(--lime);color:#10150a}.btn:disabled{opacity:.5;cursor:not-allowed}.applyTag{font-size:10px;padding:3px 6px;border-radius:999px;background:#183625;color:#83eeb8;margin-left:6px}.applyTag.restart{background:#3b2c13;color:#ffd37a}
    @media(max-width:960px){.cards{grid-template-columns:repeat(3,1fr)}.settingGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.shell{padding:20px 12px 34px}.top{align-items:stretch;flex-direction:column}.status{align-self:flex-start}.cards{grid-template-columns:repeat(2,1fr);gap:9px}.card{min-height:91px;padding:13px}.value{font-size:22px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%;max-width:none}.foot{flex-direction:column}.panel{border-radius:17px}.settings{padding:11px}.settingsIntro{flex-direction:column}.settingGrid{grid-template-columns:1fr}.settingActions{justify-content:stretch}.settingActions .btn{flex:1}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><div class="eyebrow">Binance × OKX DEX</div><h1 class="title">资金费套利监控台</h1><div class="sub">BSC 现货深度、正资金费率与候选机会实时汇总</div></div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">正在连接</span></div>
  </header>
  <div id="error" class="error"></div>
  <section class="cards">
    <div class="card"><div class="label">运行模式</div><div id="mode" class="value">—</div></div>
    <div class="card"><div class="label">正费率合约</div><div id="positive" class="value">—</div></div>
    <div class="card"><div class="label">BSC 已匹配</div><div id="matched" class="value">—</div></div>
    <div class="card"><div class="label">套利候选</div><div id="opportunityCount" class="value">—</div></div>
    <div class="card"><div class="label">当前持仓</div><div id="positionCount" class="value">—</div></div>
    <div class="card"><div class="label">合约保证金率</div><div id="marginRatio" class="value">—</div></div>
    <div class="card"><div class="label">合约可用保证金</div><div id="availableMargin" class="value">—</div></div>
    <div class="card"><div class="label">BSC 可用 USDT</div><div id="bscAvailable" class="value">—</div></div>
    <div class="card"><div class="label">可新增名义仓位</div><div id="entryCapacity" class="value">—</div></div>
    <div class="card"><div class="label">今日已实现</div><div id="dailyPnl" class="value">—</div></div>
  </section>
  <section class="panel">
    <div class="toolbar"><div class="tabs"><button class="tab active" data-tab="funding">正费率</button><button class="tab" data-tab="opportunities">套利候选</button><button class="tab" data-tab="positions">持仓</button><button class="tab" data-tab="ledger">模拟订单</button><button class="tab" data-tab="settings">参数设置</button></div><input id="search" class="search" placeholder="搜索币种…" autocomplete="off"></div>
    <div class="tablewrap"><div id="content" class="empty"><span class="spin"></span> 正在加载数据</div></div>
    <footer class="foot"><span id="lastUpdate">尚未更新</span><span>每 __REFRESH_SECONDS__ 秒自动刷新 · 参数修改会写入独立覆盖文件</span></footer>
  </section>
</main>
<script>
  const REFRESH_SECONDS=__REFRESH_SECONDS__;let active='funding';let snapshot={health:{},funding:[],opportunities:[],positions:{},ledger:[]};let settingsState=null,settingsMessage='';
  const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const n=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
  const time=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{hour12:false})};
  function setStatus(ok,text){$('statusDot').className='dot '+(ok?'ok':'bad');$('statusText').textContent=text}
  function matchLabel(x){if(x.bsc_spot_matched)return'已匹配';const labels={ambiguous_exact_symbol:'同名歧义',no_exact_market_match:'无可信市场匹配',search_error:'搜索失败',address_already_used:'地址已占用',invalid_decimals:'精度异常'};return labels[x.bsc_match_status]||'未匹配'}
  const settingGroups=[
    {title:'常用开仓参数',runtime:true,fields:[
      {p:'strategy.min_current_funding_bps_per_interval',l:'最低当前费率',u:'bps/期',s:'0.1',h:'例如 5 表示当前费率至少 5 bps'},

      {p:'strategy.funding_ewma_alpha',l:'费率EWMA权重',u:'0–1',s:'0.01',h:'越大越重视近期费率'},

      {p:'strategy.evaluation_hold_hours',l:'收益评估持有期',u:'小时',s:'24',h:'用于评估成本和预期收益'},

      {p:'strategy.max_entry_basis_bps',l:'最大入场基差',u:'bps',s:'5',h:'现货与合约绝对基差超过后拒绝开仓'}]},

      {p:'strategy.price_arb_cooldown_hours',l:'价差退出冷却',u:'小时',s:'1',h:'退出后暂不重复进入'}]},

  ];
  const getPath=(o,p)=>p.split('.').reduce((v,k)=>v?.[k],o);const setPath=(o,p,v)=>{const ks=p.split('.');let x=o;ks.slice(0,-1).forEach(k=>x=x[k]);x[ks[ks.length-1]]=v};
  function rowsFunding(){const q=$('search').value.trim().toUpperCase();const data=snapshot.funding.filter(x=>!q||x.symbol.includes(q)||x.base_asset.includes(q));if(!data.length)return empty('没有符合条件的正费率合约');return `<table><thead><tr><th>合约</th><th>本期费率</th><th>简单年化</th><th>标记价格</th><th>下次结算</th><th>BSC现货</th><th>链上报价</th><th>深度样本</th></tr></thead><tbody>${data.map(x=>{const d=x.depth_history||{};return `<tr><td><div class="sym">${esc(x.symbol)}</div><div class="small">${esc(x.base_asset)}</div></td><td class="pos num">+${n(x.funding_bps_per_interval,4)} bps</td><td class="pos num">${n(x.simple_apr_percent)}%</td><td class="num">${n(x.mark_price,6)}</td><td>${time(x.next_funding_time)}</td><td><span class="badge ${x.bsc_spot_matched?'yes':'no'}">${matchLabel(x)}</span></td><td><span class="badge ${x.eligible_for_okx_quotes?'yes':'no'}">${x.eligible_for_okx_quotes?'可报价':'跳过'}</span></td><td><div>${d.sample_count||0}组 · ${n(Number(d.pass_ratio||0)*100,0)}%</div><div class="small">${d.stage==='full'?'满仓就绪':d.stage==='half'?'半仓就绪':d.stage==='quarter'?'试探仓就绪':'积累中'}</div></td></tr>`}).join('')}</tbody></table>`}
  function rowsOpportunities(){const q=$('search').value.trim().toUpperCase();const data=snapshot.opportunities.filter(x=>!q||x.symbol.includes(q));if(!data.length)return empty('当前没有通过历史费率、成本与双向深度筛选的套利候选');return `<table><thead><tr><th>合约</th><th>保守净年化</th><th>30日中位</th><th>本期费率</th><th>深度历史</th><th>建议仓位</th><th>回本天数</th><th>往返成本</th><th>路由</th></tr></thead><tbody>${data.map(x=>{const d=x.depth_history||{};return `<tr><td><div class="sym">${esc(x.symbol)}</div><div class="small">费率样本 ${x.funding_history_samples||0}</div></td><td class="pos num">${n(x.net_apr_percent)}%</td><td class="num">${n(x.median_30d_apr_percent)}%</td><td class="pos num">+${n(x.funding_bps_per_interval,4)} bps</td><td><div><span class="badge ${d.stage==='full'?'yes':d.stage==='rejected'?'no':'warn'}">${d.stage==='full'?'满仓':d.stage==='half'?'半仓':d.stage==='quarter'?'试探仓':'观察中'}</span></div><div class="small">${d.sample_count||0}组 · 合格 ${n(Number(d.pass_ratio||0)*100,0)}% · P90 ${n(d.buy_p90_bps,1)}/${n(d.sell_p90_bps,1)} bps</div></td><td class="num">$${n(x.target_notional_usdt)}<div class="small">满额 $${n(x.full_target_notional_usdt)}</div></td><td class="num">${n(x.payback_days,1)}</td><td class="num">$${n(x.round_trip_cost_usdt,3)}</td><td><div>${esc((x.chain?.dexes||[]).join(', ')||'—')}</div><div class="small">当前买/卖 ${n(x.chain?.buy_price_impact_bps,2)} / ${n(x.chain?.sell_price_impact_bps,2)} bps</div></td></tr>`}).join('')}</tbody></table>`}
  function rowsPositions(){const q=$('search').value.trim().toUpperCase();const data=Object.values(snapshot.positions||{}).filter(x=>!q||x.symbol.includes(q));if(!data.length)return empty('当前没有模拟或实盘持仓');return `<table><thead><tr><th>合约</th><th>名义仓位</th><th>累计资金费</th><th>保守年化</th><th>30日中位</th><th>正费率占比</th><th>弱结算次数</th><th>资金去向判断</th><th>对冲偏差</th><th>爆仓距离</th></tr></thead><tbody>${data.map(x=>`<tr><td class="sym">${esc(x.symbol)}</td><td class="num">$${n(x.notional_usdt)}</td><td class="${x.funding_accrued_usdt>=0?'pos':'neg'} num">$${n(x.funding_accrued_usdt,4)}</td><td class="num">${n(x.funding_apr_percent)}%</td><td class="num">${n(x.median_30d_apr_percent)}%</td><td class="num">${n(Number(x.positive_funding_ratio)*100,1)}%</td><td class="num">${x.weak_funding_settlements||0}/3</td><td>${esc(x.allocation_decision||'继续持有并收取资金费')}</td><td class="num">${n(x.hedge_drift_percent)}%</td><td class="num">${x.liquidation_distance_x?n(x.liquidation_distance_x,2)+'×':'—'}</td></tr>`).join('')}</tbody></table>`}
  function rowsLedger(){const q=$('search').value.trim().toUpperCase();const labels={open:'开仓',increase:'加仓',close:'平仓',reduce:'减仓',hedge_correction:'对冲修正',config_update:'参数修改'};const data=(snapshot.ledger||[]).filter(x=>!q||String(x.symbol||'').toUpperCase().includes(q)||String(x.event||'').toUpperCase().includes(q));if(!data.length)return empty('模拟订单产生后会显示在这里');return `<table><thead><tr><th>时间</th><th>事件</th><th>合约</th><th>模式</th><th>原因</th><th>金额 / 结果</th></tr></thead><tbody>${data.map(x=>{const detail=x.event==='open'?`$${n(x.notional_usdt)} · APR ${n(x.funding_apr_percent)}%`:x.event==='increase'?`加仓 $${n(x.added_notional_usdt)} · 总仓 $${n(x.total_notional_usdt)}`:x.event==='close'?`PnL $${n(x.pnl_usdt,4)} · 资金费 $${n(x.funding_usdt,4)}`:x.event==='reduce'?`减仓 ${n(Number(x.fraction)*100,1)}% · PnL $${n(x.pnl_usdt,4)} · 资金费 $${n(x.funding_usdt,4)}`:x.event==='config_update'?`${esc((x.changed_sections||[]).join('、'))}${x.restart_required?' · 需要重启':''}`:`现货 ${n(x.token_qty,6)} / 空单 ${n(x.short_qty,6)}`;return `<tr><td>${time(x.time)}</td><td><span class="badge ${(x.event==='close'||x.event==='reduce')?(Number(x.pnl_usdt)>=0?'yes':'warn'):x.event==='open'||x.event==='increase'||x.event==='config_update'?'yes':''}">${esc(labels[x.event]||x.event||'事件')}</span></td><td class="sym">${esc(x.symbol||'—')}</td><td>${esc(x.mode||'—')}</td><td>${esc(x.reason||'—')}</td><td class="num">${detail}</td></tr>`}).join('')}</tbody></table>`}
  function renderSettings(){if(!settingsState)return settingsMessage?`<div class="empty neg">${esc(settingsMessage)}</div>`:`<div class="empty"><span class="spin"></span> 正在读取参数</div>`;const s=settingsState.settings;const groups=settingGroups.map(g=>`<section class="settingSection"><h3>${esc(g.title)}<span class="applyTag ${g.restart?'restart':''}">${g.restart?'重启后生效':'下一轮生效'}</span></h3><div class="settingGrid">${g.fields.map(f=>`<div class="settingField"><label>${esc(f.l)} <span class="small">${esc(f.u)}</span></label><input type="number" inputmode="decimal" step="${esc(f.s)}" data-setting="${esc(f.p)}" value="${esc(getPath(s,f.p))}"><div class="settingHint">${esc(f.h)}</div></div>`).join('')}</div></section>`).join('');return `<div class="settings"><div class="settingsIntro"><div><h2>策略参数设置</h2><div class="small">当前模式：${esc(settingsState.mode).toUpperCase()}。密钥、钱包地址、实盘开关和代币合约不会在页面展示。</div></div><span class="badge ${settingsState.mode==='live'?'warn':'yes'}">${settingsState.mode==='live'?'实盘修改请谨慎':'模拟调试'}</span></div>${settingsMessage?`<div class="notice ${settingsMessage.startsWith('失败')?'bad':'good'}">${esc(settingsMessage)}</div>`:''}<form id="settingsForm">${groups}<div class="settingActions"><button class="btn" type="button" id="reloadSettings">放弃修改</button><button class="btn primary" type="submit" id="saveSettings">确认并保存</button></div></form></div>`}
  function bindSettings(){const form=$('settingsForm');if(!form)return;$('reloadSettings').onclick=()=>loadSettings(true);form.onsubmit=saveSettings}
  async function loadSettings(force=false){if(settingsState&&!force){render();return}settingsMessage='';try{const r=await fetch('/v1/settings',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());settingsState=await r.json()}catch(err){settingsMessage='失败：'+err.message}render()}
  async function saveSettings(ev){ev.preventDefault();const next=JSON.parse(JSON.stringify(settingsState.settings));for(const input of document.querySelectorAll('[data-setting]')){const value=input.valueAsNumber;if(!Number.isFinite(value)){settingsMessage='失败：请检查空白或无效数字';render();return}setPath(next,input.dataset.setting,value)}if(!confirm(`确认保存这些参数？\n\n策略与风控参数会在下一轮扫描生效；标记为“重启后生效”的参数需要重新启动程序。${settingsState.mode==='live'?'\n\n当前是实盘模式，请再次确认仓位和风控数值。':''}`))return;const btn=$('saveSettings');btn.disabled=true;btn.textContent='正在保存…';try{const r=await fetch('/v1/settings',{method:'POST',headers:{'Content-Type':'application/json','X-Config-Intent':'save'},body:JSON.stringify(next)});if(!r.ok)throw new Error((await r.text()).trim());settingsState=await r.json();const changed=(settingsState.changed_sections||[]).join('、')||'没有数值变化';settingsMessage=`已保存：${changed}。${settingsState.applied_after_next_cycle?'策略/风控将在下一轮扫描生效。':''}${settingsState.restart_required?'其余修改需要重启程序。':''}`}catch(err){settingsMessage='失败：'+err.message}render()}
  const empty=t=>`<div class="empty">${esc(t)}</div>`;
  function render(preserveSettingsForm=false){const h=snapshot.health||{};$('mode').textContent=(h.mode||'—').toUpperCase();$('positive').textContent=h.positive_funding_markets??snapshot.funding.length;$('matched').textContent=h.monitored_bsc_tokens??'—';$('opportunityCount').textContent=h.opportunities??snapshot.opportunities.length;$('positionCount').textContent=h.positions??Object.keys(snapshot.positions||{}).length;const live=(h.mode||'').toLowerCase()==='live';const mr=Number(h.account_margin_ratio_percent||0);$('marginRatio').textContent=live?n(mr,1)+'%':'—';$('marginRatio').className='value '+(mr>=80?'neg':mr>=55?'warn':'pos');$('availableMargin').textContent=live?'$'+n(h.account_available_balance_usdt):'—';$('bscAvailable').textContent=live?'$'+n(h.bsc_usdt_available):'—';$('entryCapacity').textContent=live?'$'+n(h.available_entry_notional_usdt):'—';const pnl=Number(h.daily_realized_pnl_usdt||0);$('dailyPnl').textContent=(pnl>=0?'+':'')+'$'+n(pnl);$('dailyPnl').className='value '+(pnl>=0?'pos':'neg');if(active==='settings'){if(preserveSettingsForm&&$('settingsForm'))return;$('content').innerHTML=renderSettings();bindSettings()}else $('content').innerHTML=active==='funding'?rowsFunding():active==='opportunities'?rowsOpportunities():active==='positions'?rowsPositions():rowsLedger()}
  async function load(){try{const [health,funding,opportunities,positions,ledger]=await Promise.all(['/healthz','/v1/funding','/v1/opportunities','/v1/positions','/v1/ledger'].map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok&&u!=='/healthz')throw new Error(`${u} HTTP ${r.status}`);return r.json()}));snapshot={health,funding,opportunities,positions,ledger};const paused=Boolean(health.entry_paused_by_margin||health.risk_increase_blocked);if(health.risk_block_reason){$('error').textContent='交易安全锁：'+health.risk_block_reason;$('error').style.display='block'}else $('error').style.display='none';setStatus(!paused&&(health.status==='ok'||health.status==='starting'),paused?'风控暂停开仓':health.status==='ok'?'运行正常':health.status==='starting'?'正在启动':'运行降级');$('lastUpdate').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})+(health.last_success?' · 数据 '+time(health.last_success):'');render(active==='settings')}catch(err){setStatus(false,'连接失败');$('error').textContent='读取监控数据失败：'+err.message;$('error').style.display='block'}}
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.tab;$('search').style.display=active==='settings'?'none':'';if(active==='settings')loadSettings();else render()}));$('search').addEventListener('input',render);load();setInterval(load,REFRESH_SECONDS*1000);
</script>
</body>
